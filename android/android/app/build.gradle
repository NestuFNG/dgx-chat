apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Release signing.
// Credentials live in android/keystore/keystore.properties (git-ignored) or in
// environment variables. There are NO hard-coded passwords: without them the
// release variant is built unsigned instead of silently using a shared key.
//   storeFile      path to the JKS (relative to this module, or absolute)
//   storePassword  keystore password
//   keyAlias       key alias
//   keyPassword    key password
// Env overrides: DGX_KEYSTORE_FILE / DGX_KEYSTORE_PASSWORD / DGX_KEY_ALIAS / DGX_KEY_PASSWORD
// ---------------------------------------------------------------------------
def keystorePropsFile = file("../../keystore/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def ksStoreFile     = System.getenv("DGX_KEYSTORE_FILE")     ?: keystoreProps.getProperty("storeFile",     "../../keystore/release.jks")
def ksStorePassword = System.getenv("DGX_KEYSTORE_PASSWORD") ?: keystoreProps.getProperty("storePassword", "")
def ksKeyAlias      = System.getenv("DGX_KEY_ALIAS")         ?: keystoreProps.getProperty("keyAlias",      "release")
def ksKeyPassword   = System.getenv("DGX_KEY_PASSWORD")      ?: keystoreProps.getProperty("keyPassword",   "")
def ksConfigured    = (ksStorePassword ?: "").toString().trim() != "" && file(ksStoreFile).exists()

android {
    namespace "com.dgxchat.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dgxchat.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.0.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (ksConfigured) {
            release {
                storeFile file(ksStoreFile)
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
                enableV1Signing false   // minSdk 24 -> v2 is enough
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            // Deliberately NO minification/obfuscation: Capacitor's bridge is
            // reflective (JS interface names, plugin classes) and R8 is not
            // worth the risk for a 3 MB app. Proguard is therefore inert.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (ksConfigured) {
                signingConfig signingConfigs.release
            } else {
                logger.lifecycle("DGX Chat: no release keystore configured " +
                        "(android/keystore/keystore.properties or DGX_KEYSTORE_* env vars) " +
                        "- assembleRelease will produce an UNSIGNED APK.")
            }
        }
        debug {
            // debug builds keep the debug keystore; only `assembleRelease`
            // produces the distributable signed APK.
            applicationIdSuffix ""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
