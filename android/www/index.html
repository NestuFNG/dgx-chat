<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DGX Chat</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0b0f14; }
    body {
      color: #e6edf3; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 22px 18px 40px; box-sizing: border-box; overflow-y: auto;
    }
    .head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .logo {
      width: 56px; height: 56px; border-radius: 15px; background: #121a24;
      border: 1px solid #223042; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 17px; letter-spacing: .5px; color: #4ea1ff;
    }
    h1 { font-size: 19px; margin: 0 0 3px; }
    .sub { color: #8b98a8; font-size: 13px; margin: 0; }
    .card { background: #10161e; border: 1px solid #1e2a38; border-radius: 14px; padding: 14px; margin: 12px 0; }
    .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #6f7f92; margin: 0 0 10px; }
    .row { display: flex; gap: 8px; align-items: center; }
    input[type=text] {
      flex: 1; min-width: 0; background: #0a0f15; border: 1px solid #223042; color: #e6edf3;
      border-radius: 10px; padding: 11px 12px; font-size: 14px;
    }
    button {
      background: #1d4ed8; color: #fff; border: 0; border-radius: 10px; padding: 11px 15px;
      font-size: 14px; font-weight: 600; white-space: nowrap;
    }
    button.ghost { background: #18212c; color: #b9c7d6; border: 1px solid #223042; }
    button:active { filter: brightness(.88); }
    pre {
      white-space: pre-wrap; word-break: break-all; font-size: 12.5px; line-height: 1.5;
      background: #0a0f15; border: 1px solid #1b2531; border-radius: 10px; padding: 10px;
      margin: 10px 0 0; max-height: 210px; overflow: auto; color: #9fb3c8;
    }
    .ok { color: #3ddc97; } .bad { color: #ff6b6b; } .warn { color: #f5b84b; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 0; font-size: 13px; }
    dt { color: #6f7f92; } dd { margin: 0; word-break: break-all; }
  </style>
</head>
<body>
  <div class="head">
    <div class="logo">DGX</div>
    <div>
      <h1>DGX Chat</h1>
      <p class="sub" id="booting">DGX Chat booting…</p>
    </div>
  </div>

  <div class="card">
    <h2>运行环境 / runtime</h2>
    <dl id="env"></dl>
  </div>

  <div class="card">
    <h2>后端连通性 / cleartext + CORS 探测</h2>
    <div class="row">
      <input id="origin" type="text" value="http://YOUR-SERVER:8439" spellcheck="false" />
    </div>
    <div class="row" style="margin-top:10px">
      <button id="probe">GET /models</button>
      <button class="ghost" id="preflight">OPTIONS 预检</button>
      <button class="ghost" id="mic">麦克风</button>
    </div>
    <pre id="log">点上面的按钮开始探测。</pre>
  </div>

  <p class="sub">这是管线验证占位构建；正式前端就绪后会用真实 bundle 重新打包。</p>

  <script>
    (function () {
      var log = document.getElementById('log');
      var lines = [];
      function out(s, cls) {
        lines.push((cls ? '<span class="' + cls + '">' + s + '</span>' : s));
        log.innerHTML = lines.join('\n');
      }
      function esc(s) { return String(s).replace(/[<>&]/g, function (c) { return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }); }

      var caps = window.Capacitor;
      var env = {
        'Capacitor': caps ? (caps.getPlatform ? caps.getPlatform() : 'yes') + ' / ' + (caps.DEBUG ? 'ui?' : '') : 'not injected',
        'origin': location.origin,
        'secure context': String(window.isSecureContext),
        'localStorage': (function () { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return 'ok'; } catch (e) { return 'FAIL ' + e.name; } })(),
        'userAgent': navigator.userAgent
      };
      var dl = document.getElementById('env');
      Object.keys(env).forEach(function (k) {
        var dt = document.createElement('dt'); dt.textContent = k;
        var dd = document.createElement('dd'); dd.textContent = env[k];
        dl.appendChild(dt); dl.appendChild(dd);
      });
      document.getElementById('booting').textContent =
        'DGX Chat booting… (' + (caps ? 'capacitor ' + caps.getPlatform() : 'plain web') + ')';

      function fetchProbe(method) {
        var base = document.getElementById('origin').value.replace(/\/+$/, '');
        var url = base + '/models';
        var t0 = performance.now();
        out('→ ' + method + ' ' + url + '  (from ' + location.origin + ')');
        fetch(url, {
          method: method,
          headers: method === 'GET' ? { 'Accept': 'application/json' } : {
            'Access-Control-Request-Method': 'GET',
            'Access-Control-Request-Headers': 'authorization,x-api-key'
          },
          mode: 'cors'
        }).then(function (r) {
          var ms = Math.round(performance.now() - t0);
          out('← HTTP ' + r.status + ' ' + r.statusText + '  (' + ms + ' ms)  type=' + r.type, 'ok');
          return r.text();
        }).then(function (body) {
          out('body: ' + body.slice(0, 300), 'ok');
        }).catch(function (e) {
          var ms = Math.round(performance.now() - t0);
          out('✗ ' + e.name + ': ' + e.message + '  (' + ms + ' ms)  origin=' + location.origin, 'bad');
          out('  若为 TypeError/Failed to fetch：多为 CORS 头缺失或明文被拦。后端需回 Access-Control-Allow-Origin: ' + location.origin, 'warn');
        });
      }

      document.getElementById('probe').addEventListener('click', function () { fetchProbe('GET'); });
      document.getElementById('preflight').addEventListener('click', function () { fetchProbe('OPTIONS'); });

      document.getElementById('mic').addEventListener('click', function () {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          out('✗ 本 WebView 无 getUserMedia', 'bad'); return;
        }
        out('→ getUserMedia({audio:true}) …');
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
          out('✓ 麦克风授权成功，tracks=' + s.getAudioTracks().length, 'ok');
          s.getTracks().forEach(function (t) { t.stop(); });
        }).catch(function (e) {
          out('✗ ' + e.name + ': ' + e.message, 'bad');
          out('  NotAllowedError = 运行时权限被拒；NotFoundError = 无输入设备；SecurityError = 非安全上下文', 'warn');
        });
      });
    })();
  </script>
</body>
</html>
