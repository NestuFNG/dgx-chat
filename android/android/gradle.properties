# Project-wide Gradle settings.

# Spec: keep enough heap for AGP + dex; daemon on for fast incremental rebuilds.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.daemon=true

# AGP 8.2.1 is the Capacitor 6 default; platform 35 is what our SDK ships.
# This suppresses the "compileSdk 35 not tested with this AGP" warning.
android.suppressUnsupportedCompileSdk=35

# AndroidX package structure
android.useAndroidX=true

# Faster builds
org.gradle.caching=true
