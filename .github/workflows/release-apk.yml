# Build the Android APK on a tag push and attach it to the GitHub release.
#
# Signing is optional. Add these repository secrets to get a signed release:
#
#   ANDROID_KEYSTORE_BASE64    base64 of your release .jks
#                              (Windows: [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.jks")))
#                              (macOS/Linux: base64 -w0 release.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password
#
# Without them the workflow still succeeds: it builds a debug-signed APK,
# uploads it as an artifact and says so in the run log. Tags never fail just
# because signing secrets are missing.

name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: |
            app/pnpm-lock.yaml
            android/pnpm-lock.yaml

      - name: Build the web bundle
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Capacitor dependencies
        working-directory: android
        run: pnpm install --frozen-lockfile

      - name: Sync the web bundle into the native project
        working-directory: android
        run: npx cap sync android

      - name: Provide the release keystore (only when the secret exists)
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release.jks
          echo "Release keystore written to android/keystore/release.jks"

      - name: Build release APK
        if: env.HAS_SIGNING == 'true'
        working-directory: android/android
        env:
          DGX_KEYSTORE_FILE: ${{ github.workspace }}/android/keystore/release.jks
          DGX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DGX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DGX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain --no-daemon

      - name: Build debug APK instead (no signing secrets configured)
        if: env.HAS_SIGNING != 'true'
        working-directory: android/android
        run: |
          echo "::notice title=Unsigned build::No ANDROID_KEYSTORE_BASE64 secret is set, so this run produces a DEBUG-signed APK instead of a release-signed one."
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain --no-daemon

      - name: Collect the APK
        id: collect
        run: |
          set -e
          if [ "$HAS_SIGNING" = "true" ]; then
            SRC="android/android/app/build/outputs/apk/release/app-release.apk"
            KIND="release"
          else
            SRC="android/android/app/build/outputs/apk/debug/app-debug.apk"
            KIND="debug"
          fi
          if [ ! -f "$SRC" ]; then
            echo "expected APK not found at $SRC"
            find android/android/app/build/outputs -name '*.apk' -print || true
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$VERSION" ] || VERSION="dev"
          NAME="DGX-Chat-${VERSION}-${KIND}.apk"
          mkdir -p out
          cp "$SRC" "out/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          sha256sum "out/$NAME" || shasum -a 256 "out/$NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          path: out/${{ steps.collect.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ steps.collect.outputs.name }}
          draft: false
          generate_release_notes: true
          body: |
            Build type: **${{ steps.collect.outputs.kind }}**
            (unsigned/debug builds are produced when no signing secrets are configured).

            Install on Android 7.0+ (`minSdk 24`). Set your server address in the
            app settings after installing — one APK works against any deployment.
