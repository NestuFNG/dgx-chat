name: container image

# Publishes a self-contained image (backend + bundled web client) to GitHub
# Packages, so `docker run ghcr.io/<owner>/dgx-chat` works without cloning.
#
# Triggered by a GitHub release, or manually from the Actions tab.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to apply (defaults to the release tag or 'edge')"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image tags
        id: meta
        run: |
          set -eu
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/dgx-chat"
          version="${{ github.event.release.tag_name }}"
          if [ -z "$version" ]; then version="${{ inputs.tag }}"; fi
          if [ -z "$version" ]; then version="edge"; fi
          version="${version#v}"
          {
            echo "image=${image}"
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${image}:${version}"
            echo "${image}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "building ${image}:${version} and :latest"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=DGX Chat
            org.opencontainers.image.description=Self-hosted chat backend with a bundled web client
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Container image published"
            echo ""
            echo '```'
            echo "docker run -d -p 8439:8439 -v dgxchat-data:/data \\"
            echo "  -e DGX_BASE_URL=http://your-gateway:8000/v1 \\"
            echo "  ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
            echo '```'
            echo ""
            echo "Data (SQLite + uploads) lives in the \`/data\` volume."
          } >> "$GITHUB_STEP_SUMMARY"
